<!DOCTYPE html>
<html>
<head>
  <title>IBL 2026 clutch player REGULAR season</title>
  <script type="text/javascript" language="javascript" charset="utf8" src="../../../DataTables/jQuery-3.6.0.min.js"></script>
  <link rel="stylesheet" type="text/css" href="../../../DataTables/jquery.dataTables.min.css"/>
  <link rel="stylesheet" type="text/css" href="../../../DataTables/fixedColumns.dataTables.min.css"/>
  <link rel="stylesheet" type="text/css" href="../../../DataTables/select2.min.css"/>
  <style>
    .heading {
        text-align: center;
        padding-top:10px;
        padding-left:10px;
    }
    button{
      width: 70px;
      height: 30px;
      padding-left:0px;
      border-color: grey;
      float: left;
      cursor: pointer;
      color: black;
      background-color: grey;
    }
    h1 {
        display: inline-block;
    }
    th, td { white-space: nowrap; }
    div.dataTables_wrapper {
        width: 1000px;
        margin: 0 auto;
    }
    div.filter {
      display: inline-block;
      float: left;
      border: solid 4px white;
    }
  </style>
  <script type="text/javascript" language="javascript" charset="utf8" src="../../../DataTables/jquery.dataTables.min.js"></script>
  <script type="text/javascript" language="javascript" charset="utf8" src="../../../DataTables/dataTables.fixedColumns.min.js"></script>
  <script type="text/javascript" language="javascript" charset="utf8" src="../../../DataTables/select2.min.js"></script>


</head>
<body>
  <div class="heading">
  </div>
  <div id="container2">
    <div class="filter">
      <label for="stat3">Column hide filter:</label>
      <select name="stat3" id="stat3" multiple='multiple'>
        <option>Filter 3</option>
      </select>
    </div>
    <div class="filter">
      <label for="stat4">Column color scale:</label>
      <select name="stat4" id="stat4" multiple='multiple'>
        <option>Filter 4</option>
      </select>
    </div>
  </div>
  <div id="container">
  </div>
  <h3>Qualification: >15PPG</h3>
  <script type="text/javascript" language="javascript" charset="utf8">
  //jquery colorized
  (function($) {
    $.fn.colorize = function(oOptions) {
        var settings = $.extend({
            parse: function(e) {
                return parseFloat(e.html());
            },
            min: undefined,
            max: undefined,
            readable: true,
            themes: {
                "default": {
                    color_min: "#C80000",
                    color_mid: "#FFFFFF",
                    color_max: "#10A54A"
                },
                "blue-white-red": {
                  color_min: "#312F9D",
                  color_mid: "#FFFFFF",
                  color_max: "#C80000"
                }
            },
            theme: "default",
            center: undefined,
            percent: false
        }, oOptions);

        var min = 0;
        var max = 0;
        this.each(function() {
            var value = parseFloat(settings.parse($(this)));
            if (!isNaN(value) && isFinite(value)) {
                min = Math.min(min, value);
                max = Math.max(max, value);
                $(this).data('colorize', value);
            }
        });

        if (settings.center === undefined) settings.center = mean(this);
        var adj = settings.center - min;

        this.each(function() {
            var value = $(this).data('colorize');
            var ratio = (settings.center - value) / adj;
            var color1, color2;

            if (!settings.percent && value <= settings.min) {
                color1 = settings.themes[settings.theme].color_min;
                color2 = settings.themes[settings.theme].color_min;
            } else if (!settings.percent && value >= settings.max) {
                color1 = settings.themes[settings.theme].color_max;
                color2 = settings.themes[settings.theme].color_max;
            } else if (settings.percent && ratio <= settings.min) {
                color1 = settings.themes[settings.theme].color_min;
                color2 = settings.themes[settings.theme].color_min;
            } else if (settings.percent && ratio >= settings.max) {
                color1 = settings.themes[settings.theme].color_max;
                color2 = settings.themes[settings.theme].color_max;
            } else if (value < settings.center) {
                ratio = Math.abs(ratio);
                if (ratio < -1) ratio = -1;
                color1 = settings.themes[settings.theme].color_min;
                color2 = settings.themes[settings.theme].color_mid;
            } else {
                ratio = Math.abs(ratio);
                if (ratio > 1) ratio = 1;
                color1 = settings.themes[settings.theme].color_max;
                color2 = settings.themes[settings.theme].color_mid;
            }
            var color = getColor(color1, color2, ratio);
            $(this).css('background-color', color);
            if (settings.readable)
                $(this).css('color', getContrastYIQ(color));
        });

        function getColor(color1, color2, ratio) {
            var hex = function(x) {
                x = x.toString(16);
                return (x.length == 1) ? '0' + x : x;
            };
            color1 = (color1.charAt(0) == "#") ? color1.slice(1) : color1;
            color2 = (color2.charAt(0) == "#") ? color2.slice(1) : color2;
            var r = Math.ceil(parseInt(color1.substring(0,2), 16) * ratio + parseInt(color2.substring(0,2), 16) * (1-ratio));
            var g = Math.ceil(parseInt(color1.substring(2,4), 16) * ratio + parseInt(color2.substring(2,4), 16) * (1-ratio));
            var b = Math.ceil(parseInt(color1.substring(4,6), 16) * ratio + parseInt(color2.substring(4,6), 16) * (1-ratio));
            return "#" + (hex(r) + hex(g) + hex(b)).toUpperCase();
        }

        function mean(arr) {
            var avg = 0;
            arr.each(function() {
                if ($(this).data('colorize') !== undefined) {
                    avg += $(this).data('colorize');
                }
            });
            return avg / arr.length;
        }

        // http://24ways.org/2010/calculating-color-contrast/
        function getContrastYIQ(hexcolor) {
            var hex = (hexcolor.charAt(0) == "#") ? hexcolor.slice(1) : hexcolor;
            var r = parseInt(hex.substr(0,2),16);
            var g = parseInt(hex.substr(2,2),16);
            var b = parseInt(hex.substr(4,2),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        return this;
    };
  }(jQuery));

  $(document).ready(function() {
    $('#container').load('BoxscoreCLUTCH.html', function() {
      $('#BOXCLUTCH').append('<tfoot><tr></tr></tfoot>');
      $('#BOXCLUTCH thead tr:nth-child(2) th').clone().appendTo($("#BOXCLUTCH tfoot tr"));
      var input = [];
      var input2;
      $('#BOXCLUTCH thead tr:nth-child(2) th').each( function (key,values) {
        if (key<3) {
          input.push(values.innerHTML);
        } else if(key === 3 || key === 4) {
          input2 = $('#BOXCLUTCH thead tr:nth-child(1) th:nth-child(2)').first().text();
          input.push(input2+' '+values.innerHTML);
        } else if(key === 5 || key === 6) {
          input2 = $('#BOXCLUTCH thead tr:nth-child(1) th:nth-child(3)').first().text();
          input.push(input2+' '+values.innerHTML);
        } else if(key === 7 || key === 8) {
          input2 = $('#BOXCLUTCH thead tr:nth-child(1) th:nth-child(4)').first().text();
          input.push(input2+' '+values.innerHTML);
        }
      });
      input.forEach( function (values,key) {
        if (key<2){return true;}
        $('#stat3').append($('<option>', { value : key }).text(values));
        $('#stat4').append($('<option>', { value : key }).text(values));
      });
      var table = $('#BOXCLUTCH').DataTable( {
            scrollY:        "400px",
            scrollCollapse: true,
            paging:         false,
            // Table Heat Map
            drawCallback: function () {
              $('#BOXCLUTCH tbody td.coloured').css({'background-color': '', 'color': ''}).toggleClass('coloured');
            },

            initComplete: function () {
              count = 0;
              this.api().columns([0,1]).every( function () {
                var title = this.header();
                //replace spaces with dashes
                title = $(title).html().replace(/[\W]/g, '-');
                var column = this;
                var select = $('<select id="' + title + '" class="select2" ></select>')
                .appendTo( $(column.footer()).empty() )
                .on( 'change', function () {
                  //Get the "text" property from each selected data
                  //regex escape the value and store in array
                  var data = $.map( $(this).select2('data'), function( value, key ) {
                    return value.text ? '^' + $.fn.dataTable.util.escapeRegex(value.text) + '$' : null;
                  });

                  //if no data selected use ""
                  if (data.length === 0) {
                    data = [""];
                  }

                  //join array into string with regex or (|)
                  var val = data.join('|');

                  //search for the option(s) selected
                  column
                  .search( val ? val : '', true, false )
                  .draw();
                } );

                column.data().unique().sort().each( function ( d, j ) {
                  select.append( '<option value="'+d+'">'+d+'</option>' );
                } );

                //use column title as selector and placeholder
                $('#' + title).select2({
                  multiple: true,
                  closeOnSelect: false,
                  placeholder: "Select a " + title
                });

                //initially clear select otherwise first option is selected
                $('.select2').val(null).trigger('change');
              } );
            }
          });

      //column hide filter
      var index3 = $('#stat3').val() || [];
      $('#stat3').on("change", function() {
        $('#stat4').empty();
        $('#stat4').append($('<option>').text('Filter 4'));
        table.columns(index3).visible(true);
        index3 = $('#stat3').val() || [];
        table.columns(index3).visible(false);
        var dummy = [];
        var i = 0;
        input.forEach( function (values,key) {
          if(index3.includes(key.toString())===false){
            dummy.push(values);
            if (
              values == 'PLAYER' ||
              values == 'CODE' ){
              i = i+1;
              return true;}
            $('#stat4').append($('<option>', { value : i }).text(values));
            i = i+1;
          }
        });
        $('#BOXCLUTCH tbody td.coloured').css({'background-color': '', 'color': ''}).toggleClass('coloured');
      });

      //column color scale
      var index4 = $('#stat4').val() || [];
      $('#stat4').on("change", function() {
        $('#BOXCLUTCH tbody td.coloured').css({'background-color': '', 'color': ''}).toggleClass('coloured');
        index4 = $('#stat4').val() || [];
        index4.forEach( function (values,key) {
          values = parseInt(values,10)+1;
          $("#BOXCLUTCH tbody td:nth-child("+(values)+")").colorize().toggleClass('coloured');
        });
      });

    });
  });

  </script>
</body>
</html>
